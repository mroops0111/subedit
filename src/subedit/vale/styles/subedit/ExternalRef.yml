extends: existence
message: "Reference '%s' may be a ticket a reader cannot open. Keep a public identifier such as a spec proposal, and restate a private ticket's constraint instead."
level: warning
nonword: true
tokens:
  - '[A-Z]{2,}-\d+\b'
# Standards and encodings are names a reader can look up, not tickets.
exceptions:
  - 'ISO-\d+'
  - 'UTF-\d+'
  - 'SHA-\d+'
  - 'AES-\d+'
  - 'CRC-\d+'
  - 'IEEE-\d+'
  - 'ECMA-\d+'
