extends: existence
message: "Trailing '%s'. Name two or three concrete examples after 'such as', which keeps the list open without trailing off."
level: error
ignorecase: true
tokens:
  - '\.\.\.'
  - '…'
  - '\band so on\b'
  # A path such as /etc/passwd names a directory rather than trailing off.
  - '(?<![/\w.])etc\b'
