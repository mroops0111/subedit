StylesPath = src/subedit/vale/styles
MinAlertLevel = warning

[*.{py,pyi,ts,mts,cts,tsx,js,go,rs}]
BasedOnStyles = subedit

[*.md]
BasedOnStyles = subedit
# These guard a comment against going stale. A Markdown note may tell a history,
# cite an issue, date a release, or explain a tag on purpose.
subedit.EditHistory = NO
subedit.SignatureTag = NO
subedit.DateRef = NO
subedit.ExternalRef = NO

[tests/fixtures/vale/*]
BasedOnStyles =
