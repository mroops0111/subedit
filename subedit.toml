[subedit]
line-width = 120
exclude = ["tests/fixtures/**"]

[rules]
mid-clause-break = "error"
line-too-long = "error"
stub-fragment = "error"
unbreakable-sentence = "error"
file-header-comment = "error"
plain-comment-on-public = "error"
signature-restating-tag = "error"
block-too-long = "error"

[rules.heading-title-case]
keep = ["subedit"]
