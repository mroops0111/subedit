[project]
name = "subedit"
version = "0.3.2"
description = "A subeditor for AI agents, keeping every sentence they write to your house style."
authors = [
    {name = "Yun-Tai Yang"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["linter", "formatter", "comments", "prose", "lsp", "tree-sitter", "python", "typescript"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "autocorrect-py>=2.14.0",
    "pydantic>=2.13.5",
    "tree-sitter>=0.26.0",
    "tree-sitter-markdown>=0.5.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "basedpyright>=1.40.1",
    "ruff>=0.16.7",
]
vale = [
    "vale>=3.22.0.0",
]

[project.scripts]
subedit = "subedit.presentation.cli:main"
subedit-hook = "subedit.presentation.hook:main"

[project.urls]
Homepage = "https://github.com/mroops0111/subedit"
Repository = "https://github.com/mroops0111/subedit"
Issues = "https://github.com/mroops0111/subedit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subedit"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "ERA",  # eradicate, commented-out code
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "S104",   # use of binding
    "T201",   # print statements
    "B008",   # do not perform function calls in argument defaults
    "RUF012", # mutable class attributes should be annotated with ClassVar
]

fixable = ["ALL"]
unfixable = []

exclude = [
    ".git",
    ".venv",
    "node_modules",
    "venv",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]
"examples/**/*.py" = ["RUF001", "T201"]
"__init__.py" = ["F401"]
# These modules match CJK punctuation by design, so a full-width character is the point, not a typo.
"src/subedit/domain/rules/style.py" = ["RUF001"]
"src/subedit/domain/models/prose.py" = ["RUF001"]
"src/subedit/domain/models/title_case.py" = ["RUF001"]
"tests/test_style.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["subedit"]
force-single-line = false
lines-after-imports = 2
split-on-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
